# cargo-audit settings for this repository (read by `cargo audit` in CI).
#
# Every ignore here needs a reason and a "drop when" condition. Review them
# whenever sqlx or libsqlite3-sys is upgraded. See docs/SECURITY.md,
# "Known advisories".

[advisories]
ignore = [
    # RUSTSEC-2026-0459 / CVE-2026-119375: SQLite before 3.54.0 can return
    # uninitialised page-cache memory when it opens a database together with a
    # crafted `-wal` file of a different page size.
    #
    # Why there is no upgrade: sqlx 0.9.0 (the newest release) only accepts
    # libsqlite3-sys below 0.38, and even libsqlite3-sys 0.39 builds SQLCipher
    # from sqlcipher-src 419.0.6, which still bundles SQLite 3.53.4 (affected).
    #
    # Why the risk is low for Shiftbook: the database is always SQLCipher
    # encrypted, so nobody without the key can craft a database/WAL pair the
    # app would read; the app always uses journal_mode=DELETE (never WAL); and
    # the attacker would need write access to the user's own app-data folder.
    #
    # Drop when: an sqlx release accepts a libsqlite3-sys whose SQLCipher
    # build bundles SQLite 3.54.0 or newer (sqlcipher-src 420.x).
    "RUSTSEC-2026-0459",
]

[package]
name = "shiftbook-desktop"
description = "Shiftbook desktop app (Tauri 2). Thin layer: commands call core + storage."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "shiftbook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shiftbook-core.workspace = true
shiftbook-storage.workspace = true
tauri = { version = "2", features = [] }
# Native save/open dialogs for Backup now and Restore, called from Rust only:
# the WebView gets no dialog permission.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time.workspace = true
tokio.workspace = true
zeroize.workspace = true
uuid.workspace = true

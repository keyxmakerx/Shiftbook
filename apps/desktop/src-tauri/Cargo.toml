[package]
name = "shiftbook-desktop"
description = "Shiftbook desktop app (Tauri 2). Thin layer: commands call core + storage."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "shiftbook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shiftbook-core.workspace = true
shiftbook-storage.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

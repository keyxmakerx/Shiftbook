[package]
name = "shiftbook-storage"
description = "Shiftbook repository traits and SQL storage (SQLite now, Postgres-compatible)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
shiftbook-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true
sqlx.workspace = true
# Not used in code: turning it on makes sqlx's SQLite the bundled SQLCipher build.
libsqlite3-sys.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true
secrecy.workspace = true
flate2.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
# Writes the UI's TypeScript types (web/src/lib/api/generated) when testing; see
# docs/ARCHITECTURE.md. Never on in a release build.
ts = ["dep:ts-rs", "shiftbook-core/ts"]

[package]
name = "shiftbook-app"
description = "Shiftbook app layer: views built from storage and core, shared by desktop and server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
shiftbook-core.workspace = true
shiftbook-storage.workspace = true
serde.workspace = true
uuid.workspace = true
time.workspace = true

[features]
# Writes the UI's TypeScript types (web/src/lib/api/generated) when testing; see
# docs/ARCHITECTURE.md. Never on in a release build.
ts = ["dep:ts-rs", "shiftbook-core/ts", "shiftbook-storage/ts"]

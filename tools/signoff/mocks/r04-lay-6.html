<style>*{box-sizing:border-box}body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:#2B2F33;background:#F3F4F5}
.try{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid #D7DADD;font-size:12px;flex-wrap:wrap}.try b{color:#5E656C}
.try button{font:inherit;border:1px solid #C9CDD1;background:#F6F7F8;border-radius:6px;padding:3px 10px;cursor:pointer}
.frame{position:relative;height:400px;overflow:hidden;background:#F3F4F5}
.box{background:#fff;border:1px solid #D2D6DA;border-radius:6px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#80878E}
.h{font-family:"Cascadia Mono",Consolas,Menlo,monospace;color:#2B2F33;font-weight:600}
.tk{font:11px "Cascadia Mono",Consolas,monospace;background:#E9ECEF;border-radius:3px;padding:0 5px}
.mut{color:#80878E}
.wf{position:absolute;right:10px;bottom:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A0A6AC}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.desk{position:absolute;inset:0;background:linear-gradient(135deg,#C9D0D6,#AEB7BF)}
.win{position:absolute;left:24px;top:24px;right:200px;bottom:24px;background:#EEF0F2;border-radius:6px;opacity:.7}
.strip{position:absolute;right:10px;top:24px;width:176px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.strip .row{display:flex;justify-content:space-between;font-size:12px}.strip button{font:inherit;border:1px solid #C9CDD1;background:#F6F7F8;border-radius:6px;padding:4px 8px;cursor:pointer}
.pal{position:absolute;left:50%;top:70px;width:min(420px,80%);transform:translate(-50%,-10px) scale(.97);opacity:0;pointer-events:none;transition:.25s;padding:0}
.pal.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}.pal input{width:100%;border:0;outline:0;font:15px "Segoe UI",sans-serif;padding:12px 14px;border-bottom:1px solid #E3E6E9;background:transparent}
.pal div{padding:7px 14px;font-size:12.5px}.pal div:nth-child(2){background:#EEF0F2}
.full{position:absolute;inset:10px;padding:16px;transform:scale(.96);opacity:0;pointer-events:none;transition:.35s}.full.on{transform:none;opacity:1;pointer-events:auto}
@media (max-width:620px){.win{right:24px}}
</style>
<div class="try"><b>Try it:</b><button id="cap">Press Ctrl+Shift+Space</button><button id="open">Open full Shiftbook</button></div>
<div class="frame"><div class="desk"><div class="win"></div>
 <div class="box strip"><span class="lbl">Shiftbook · Thu 15</span><div class="row"><span>Today</span><span class="h">3.5 h</span></div><div class="row"><span>Week</span><span class="h">27.0 h</span></div>
  <div class="row"><span>Now</span><span>Ops sync</span></div><div class="row" style="color:#B5453E"><span>Overdue</span><span>SSL cert</span></div><button id="cap2">+ Log or note</button></div>
 <div class="box pal" id="pal"><input placeholder="Log, note or find…" id="pi"><div>Weekly ops sync · add 30m</div><div>New note: “…”</div></div>
 <div class="box full" id="full"><span class="lbl">The full app opens only when you need it</span><p class="mut">Projects, tasks, notes map, timesheet. Close it and you're back to the small strip.</p><button id="close" style="font:inherit;border:1px solid #C9CDD1;border-radius:6px;padding:4px 10px;background:#F6F7F8">Close</button></div>
</div><span class="wf">Layout 6 · Side strip</span></div>
<script>function cap(){var p=document.getElementById('pal');p.classList.toggle('on');if(p.classList.contains('on'))document.getElementById('pi').focus()}
document.getElementById('cap').onclick=cap;document.getElementById('cap2').onclick=cap;
document.getElementById('open').onclick=function(){document.getElementById('full').classList.add('on')};document.getElementById('close').onclick=function(){document.getElementById('full').classList.remove('on')};</script>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
:root{--desk:#e9ecef;--paper:#fffdf8;--paper2:#f6f3ec;--ink:#1d2126;--ink2:#4a525b;--mut:#69727c;--mut2:#565e67;--rule:rgba(29,33,38,.1);
--accent:#3d5bb0;--warn:#9f5a06;--wash:#fcf1df;--ok:#2e8a5a;--bad:#c2412d;--none:#8a919a;--none2:#6c737c;
--teal:#178F7C;--coral:#E0573A;--plum:#8C4F7A;--amber:#E9A23B;
--display:Fraunces,Georgia,'Times New Roman',serif;--ui:'Instrument Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;
--shadow:0 1px 1px rgba(29,33,38,.06),0 10px 24px -14px rgba(29,33,38,.35)}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.45 var(--ui);padding:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:720px){.pair{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.tag{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.tag.new{color:var(--ok)}
.why{font-size:12.5px;color:var(--ink2);margin:0}
.paper{background:var(--paper);border-radius:7px;box-shadow:var(--shadow),inset 0 0 0 1px var(--rule);padding:14px 16px;position:relative}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.text-in{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 10px;font:inherit;color:inherit;min-width:0;flex:1 1 150px;outline:0}
.text-in:focus{box-shadow:0 0 0 2px var(--accent)}
.hbtn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:7px 10px;font:700 12.5px var(--mono);color:var(--ink);cursor:pointer}
.hbtn.hot{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--mono);padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 78%,var(--ink));white-space:nowrap}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;font:600 13px var(--ui);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kbd{font:500 10.5px var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2)}
.toast{background:var(--ink);color:var(--paper);border-radius:9px;padding:8px 12px;font-size:13px;display:inline-block}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:6px;border-left:3px solid var(--c,var(--none))}
.row .h{font:700 14px var(--mono)}
.row b{display:block;font-weight:600}
.row small{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:0}
.bad{outline:2px dashed var(--bad);outline-offset:3px;border-radius:6px}
.callout{font-size:12px;color:var(--bad);font-weight:600}
.good{outline:2px dashed var(--ok);outline-offset:3px;border-radius:6px}
.callout.ok{color:var(--ok)}
</style></head><body><div class="pair"><div class="side"><span class="tag">Today</span><p class="why">Enter only shows a reminder; times come from the buttons.</p><div class="paper"><label class="lbl">Log work · paste a ticket or say what you did, then pick the time</label>
<div class="in" style="margin-top:6px"><input class="text-in bad" value="INC0045678 50m" readonly>
<button class="hbtn">15m</button><button class="hbtn">30m</button><button class="hbtn">45m</button><button class="hbtn">1h</button><button class="hbtn">2h</button></div>
<div style="margin-top:12px"><span class="toast">Pick a time button to log it.</span></div>
<p class="callout" style="margin-top:8px">Enter does nothing, and there's no button for 50 minutes.</p></div></div><div class="side"><span class="tag new">Proposed</span><p class="why">Enter logs it. Routine work from yesterday is one click.</p><div class="paper"><label class="lbl" for="lw">Log work · try typing, then press Enter</label>
<div class="in" style="margin-top:6px"><input id="lw" class="text-in" value="INC0045678 50m" autocomplete="off">
<button class="hbtn">15m</button><button class="hbtn">30m</button><button class="hbtn">45m</button><button class="hbtn">1h</button><button class="hbtn">2h</button></div>
<div id="seen" style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px"></div>
<div style="margin-top:12px"><span class="lbl">Same as yesterday</span>
<div class="in" style="margin-top:6px"><button class="btn rep" data-t="Daily meeting" data-m="15" style="--c:var(--teal)"><span class="chip" style="--c:var(--teal)">15m</span> Daily meeting</button>
<button class="btn rep" data-t="General tickets" data-m="60"><span class="chip" style="--c:var(--plum)">1h</span> General tickets</button></div></div>
<div id="list" style="margin-top:12px;display:flex;flex-direction:column;gap:2px"></div></div></div></div><script>
var i=document.getElementById('lw'),s=document.getElementById('seen'),l=document.getElementById('list');
function parse(t){var m=t.match(/(\d+(?:\.\d+)?)\s*(h|m)\b/i),tk=t.match(/[A-Z]{2,}\d{4,}/g)||[];var min=m?(m[2].toLowerCase()=='h'?Math.round(parseFloat(m[1])*60):parseInt(m[1])):null;return{min:min,tk:tk}}
function fmt(m){return m>=60?(m/60)+' h':m+'m'}
function show(){var p=parse(i.value);s.innerHTML='';p.tk.forEach(function(t){var c=document.createElement('span');c.className='chip';c.textContent=t;s.appendChild(c)});
var x=document.createElement('span');x.innerHTML=p.min?'<b>'+fmt(p.min)+'</b> · press <span class="kbd">Enter</span> to log':'no time yet · <span class="kbd">Enter</span> jumps to the time buttons';s.appendChild(x)}
function add(t,m,c){var r=document.createElement('div');r.className='row';r.style.setProperty('--c',c||'var(--accent)');r.innerHTML='<span class="h">'+(m/60).toFixed(2).replace(/0$/,'')+'</span><span><b></b><small>just logged</small></span><span></span>';r.querySelector('b').textContent=t;l.prepend(r)}
i.addEventListener('input',show);show();
i.addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();var p=parse(i.value);if(p.min){add(i.value.replace(/(\d+(?:\.\d+)?)\s*(h|m)\b/i,'').trim()||'Untitled',p.min);i.value='';show()}else{document.querySelector('.hbtn').focus()}});
document.querySelectorAll('.hbtn').forEach(function(b){b.onclick=function(){var t=b.textContent,m=t.endsWith('h')?parseFloat(t)*60:parseInt(t);add(i.value.trim()||'Untitled',m);i.value='';show();i.focus()}});
document.querySelectorAll('.rep').forEach(function(b){b.onclick=function(){add(b.dataset.t,+b.dataset.m,b.dataset.t=='Daily meeting'?'var(--teal)':'var(--plum)')}});
;(function(){function t(){parent.postMessage({sbMockHeight:document.documentElement.scrollHeight},"*")}addEventListener("load",t);addEventListener("resize",t);new ResizeObserver(t).observe(document.body)})()</script></body></html>

<style>
*{box-sizing:border-box}body{margin:0;font:12px/1.35 "Segoe UI",system-ui,sans-serif;color:#D5DCE3;background:#15191E}
.try{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#fff;color:#24292F;border-bottom:1px solid #D0D7DE;font-size:12px;flex-wrap:wrap}.try b{color:#57606A}
.wrap{overflow-x:auto;padding:8px 6px}svg{display:block;min-width:720px;width:100%;height:auto}
text{fill:#D5DCE3}.dim{fill:#7E8995}.mono{font-family:"Cascadia Mono",Consolas,Menlo,monospace}
.n{cursor:pointer;transition:opacity .25s}.e{fill:none;transition:opacity .25s}
svg.focus .n:not(.hit),svg.focus .e:not(.hit){opacity:.15}
.leg{display:flex;gap:14px;padding:4px 14px 12px;color:#7E8995;flex-wrap:wrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
<div class="try"><b>Try it:</b><span>click any item to trace what it connects to; click empty space to clear</span></div>
<div class="wrap"><svg id="svg"></svg></div><div class="leg" id="leg"></div>
<script>
var MODE='timeline';
var PR={p1:{name:'Network refresh',c:'#5AA9E6'},p2:{name:'Data centre upkeep',c:'#E6A35A'}};
var PRI={h:'#F26D6D',m:'#F2B45A',l:'#7E8995'};
var KIND={note:'#5AA9E6',scrap:'#E6C35A',task:'#4CC3A8',project:'#B39DDB'};
var N=[
 {id:'n4',k:'note',t:'Idea: auto-renew certs',d:9,p:'p2',pr:'l'},
 {id:'n2',k:'note',t:'Vendor call: UPS',d:13,p:'p2',pr:'l'},
 {id:'n3',k:'scrap',t:'guest wifi drops again??',d:14,p:'p1',pr:'h'},
 {id:'n1',k:'note',t:'Weekly ops sync',d:15,p:'p1',pr:'m'},
 {id:'t4',k:'task',t:'Update backup runbook',d:15,p:'p2',pr:'l'},
 {id:'t2',k:'task',t:'Retire any-any rule',d:16,p:'p1',pr:'h'},
 {id:'t3',k:'task',t:'Order UPS batteries',d:16,p:'p2',pr:'m'},
 {id:'t1',k:'task',t:'Draft VLAN split change',d:20,p:'p1',pr:'h'}];
var E=[['n1','t1'],['n1','t2'],['n2','t3'],['n3','t1'],['n4','t4'],['n1','t4']];
var svg=document.getElementById('svg'),ns='http://www.w3.org/2000/svg',pos={},W=720,H=360;
function el(n,a,p){var e=document.createElementNS(ns,n);for(var k in a)e.setAttribute(k,a[k]);(p||bg).appendChild(e);return e}
function txt(s,a,p){var t=el('text',a,p);t.textContent=s;return t}
function X(d){return 70+(d-9)/(20-9)*(W-250)}
// Backgrounds, then wires, then items, so items always receive clicks.
var bg=svg.appendChild(document.createElementNS(ns,'g')),edges=svg.appendChild(document.createElementNS(ns,'g')),nodes=svg.appendChild(document.createElementNS(ns,'g'));
function trace(id){var hit={},eh={};hit[id]=1;[0,1].forEach(function(f){var st=[id],seen={};while(st.length){var c=st.pop();E.forEach(function(e,i){if(e[f]===c){eh[i]=1;var t=e[1-f];if(!seen[t]){seen[t]=1;hit[t]=1;st.push(t)}}})}});
 svg.classList.add('focus');svg.querySelectorAll('.n').forEach(function(g){g.classList.toggle('hit',!!hit[g.dataset.id])});svg.querySelectorAll('.e').forEach(function(p){p.classList.toggle('hit',!!eh[p.dataset.i])})}
svg.addEventListener('click',function(ev){var g=ev.target.closest('.n');if(g)trace(g.dataset.id);else svg.classList.remove('focus')});
function leg(items){document.getElementById('leg').innerHTML=items.map(function(i){return '<span><i style="background:'+i[1]+'"></i>'+i[0]+'</span>'}).join('')}

if(MODE==='nodes'){ // node editor: typed nodes with ports and wires
 svg.style.background='#15191E';
 var col={note:0,scrap:0,task:1};var cnt=[0,0];
 N.forEach(function(n){var c=col[n.k];pos[n.id]={x:[30,300][c],y:40+cnt[c]++*78,w:200,h:56}});
 pos.p1={x:560,y:90,w:140,h:56};pos.p2={x:560,y:230,w:140,h:56};
 N.forEach(function(n){if(n.k==='task')E.push([n.id,n.p,'own'])});
 var all=N.concat([{id:'p1',k:'project',t:PR.p1.name,pr:'m'},{id:'p2',k:'project',t:PR.p2.name,pr:'l'}]);
 all.forEach(function(n){var p=pos[n.id],g=el('g',{'class':'n',transform:'translate('+p.x+' '+p.y+')'},nodes);g.dataset.id=n.id;
  el('rect',{width:p.w,height:p.h,rx:6,fill:'#1F252C',stroke:'#2F3742'},g);el('path',{d:'M0 6a6 6 0 0 1 6-6h'+(p.w-12)+'a6 6 0 0 1 6 6v12h-'+p.w+'z',fill:KIND[n.k],opacity:.85},g);
  txt(n.k.toUpperCase(),{x:8,y:13,'class':'mono',fill:'#0E1114','font-size':9.5,'font-weight':700},g);
  txt('P'+({h:1,m:2,l:3})[n.pr],{x:p.w-22,y:13,'class':'mono','font-size':9.5,'font-weight':700,fill:'#0E1114'},g);
  txt(n.t,{x:8,y:38},g);if(n.d)txt('15 Oct'.replace('15',n.d),{x:8,y:51,'class':'dim mono','font-size':10},g);
  if(n.k!=='project')el('circle',{cx:p.w,cy:p.h/2+6,r:4,fill:'#15191E',stroke:'#9AA6B2','stroke-width':1.5},g);
  if(n.k!=='note'&&n.k!=='scrap')el('circle',{cx:0,cy:p.h/2+6,r:4,fill:'#15191E',stroke:'#9AA6B2','stroke-width':1.5},g)});
 E.forEach(function(e,i){var a=pos[e[0]],b=pos[e[1]];var x1=a.x+a.w,y1=a.y+a.h/2+6,x2=b.x,y2=b.y+b.h/2+6,m=(x1+x2)/2;
  var p=el('path',{d:'M'+x1+' '+y1+'C'+m+' '+y1+' '+m+' '+y2+' '+x2+' '+y2,'class':'e',stroke:e[2]?'#3A434F':'#9AA6B2','stroke-width':e[2]?1.2:1.8},edges);p.dataset.i=i});
 H=360;leg([['Note','#5AA9E6'],['Scrap from the Inbox','#E6C35A'],['Task','#4CC3A8'],['Project','#B39DDB'],['P1 high · P2 medium · P3 low','transparent']]);
}
if(MODE==='lanes'){ // swimlanes: one lane per project, time left to right
 var lanes={p1:0,p2:1},LH=150,T0=34;
 [9,11,13,15,17,19].forEach(function(d){var x=X(d);el('line',{x1:x,x2:x,y1:T0-6,y2:T0+2*LH,stroke:'#232A32'});txt(d+' Oct',{x:x,y:20,'text-anchor':'middle','class':'dim mono','font-size':10})});
 Object.keys(lanes).forEach(function(k){var y=T0+lanes[k]*LH;el('rect',{x:0,y:y,width:W,height:LH,fill:lanes[k]?'#171C21':'#1A1F25'});el('rect',{x:0,y:y,width:4,height:LH,fill:PR[k].c});
  txt(PR[k].name,{x:12,y:y+18,'font-weight':600,fill:PR[k].c})});
 var idx={};N.forEach(function(n){var i=idx[n.p]=(idx[n.p]===undefined?0:idx[n.p]+1);pos[n.id]={x:X(n.d)-50,y:T0+lanes[n.p]*LH+30+(i%3)*40,w:140,h:32}});
 E.forEach(function(e,i){var a=pos[e[0]],b=pos[e[1]];var d;if(b.x>=a.x+a.w+16){var x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x-3,y2=b.y+b.h/2,m=(x1+x2)/2;d='M'+x1+' '+y1+'C'+m+' '+y1+' '+m+' '+y2+' '+x2+' '+y2}
  else{var dn=b.y>a.y,x1=a.x+a.w/2,y1=dn?a.y+a.h:a.y,x2=b.x+b.w/2,y2=dn?b.y-3:b.y+b.h+3,k=dn?24:-24;d='M'+x1+' '+y1+'C'+x1+' '+(y1+k)+' '+x2+' '+(y2-k)+' '+x2+' '+y2}
  var p=el('path',{d:d,'class':'e',stroke:'#9AA6B2','stroke-width':1.5,'marker-end':'url(#ar)'},edges);p.dataset.i=i});
 var df=el('defs',{});var mk=el('marker',{id:'ar',viewBox:'0 0 8 8',refX:6,refY:4,markerWidth:7,markerHeight:7,orient:'auto'},df);el('path',{d:'M0 0L8 4L0 8z',fill:'#9AA6B2'},mk);
 N.forEach(function(n){var p=pos[n.id],g=el('g',{'class':'n',transform:'translate('+p.x+' '+p.y+')'},nodes);g.dataset.id=n.id;
  el('rect',{width:p.w,height:p.h,rx:n.k==='task'?4:14,fill:'#222932',stroke:n.k==='scrap'?'#E6C35A':'#36404B','stroke-dasharray':n.k==='scrap'?'4 3':''},g);
  el('circle',{cx:12,cy:p.h/2,r:4,fill:PRI[n.pr]},g);txt(n.t,{x:22,y:p.h/2+4,'font-size':11.5},g)});
 H=T0+2*LH+10;leg([['Rounded = note or scrap','#36404B'],['Square = task','#36404B'],['Dot = priority (red high, amber medium, grey low)','#F26D6D']]);
}
if(MODE==='metro'){ // metro map: each project is a line, items are stations in date order
 var lines={p1:{y:110,c:PR.p1.c},p2:{y:250,c:PR.p2.c}};
 Object.keys(lines).forEach(function(k){var L=lines[k],st=N.filter(function(n){return n.p===k}),pts=[];
  st.forEach(function(n,i){var x=120+i*150,y=L.y+(i%2?-30:0);pos[n.id]={x:x,y:y};pts.push(x+' '+y)});
  el('polyline',{points:pts.join(' '),fill:'none',stroke:L.c,'stroke-width':8,'stroke-linejoin':'round','stroke-linecap':'round'},edges);
  txt(PR[k].name+' line',{x:120,y:L.y+40,'font-weight':600,fill:L.c})});
 E.forEach(function(e,i){if(N.filter(function(n){return n.id===e[0]})[0].p===N.filter(function(n){return n.id===e[1]})[0].p)return;var a=pos[e[0]],b=pos[e[1]];
  var p=el('path',{d:'M'+a.x+' '+a.y+'L'+b.x+' '+b.y,'class':'e',stroke:'#9AA6B2','stroke-width':2,'stroke-dasharray':'2 4'},edges);p.dataset.i=i});
 N.forEach(function(n){var p=pos[n.id],g=el('g',{'class':'n',transform:'translate('+p.x+' '+p.y+')'},nodes);g.dataset.id=n.id;
  el(n.k==='task'?'rect':'circle',n.k==='task'?{x:-8,y:-8,width:16,height:16,rx:3,fill:'#F4F6F8',stroke:'#15191E','stroke-width':3}:{r:8,fill:'#F4F6F8',stroke:'#15191E','stroke-width':3},g);
  el('circle',{cx:0,cy:0,r:3,fill:PRI[n.pr]},g);
  txt(n.t,{x:0,y:-18,'text-anchor':'middle','font-size':11.5},g);txt(n.d+' Oct',{x:0,y:24,'text-anchor':'middle','class':'dim mono','font-size':10},g)});
 H=320;leg([['Circle = note','#F4F6F8'],['Square = task','#F4F6F8'],['Dotted = a link across projects','#9AA6B2'],['Centre dot = priority','#F26D6D']]);
}
if(MODE==='timeline'){ // time axis in the middle: notes above, tasks below
 var mid=180;el('line',{x1:40,x2:W-30,y1:mid,y2:mid,stroke:'#3A434F','stroke-width':2});
 [9,11,13,15,17,19].forEach(function(d){var x=X(d)+40;el('line',{x1:x,x2:x,y1:mid-5,y2:mid+5,stroke:'#3A434F','stroke-width':2});txt(d+' Oct',{x:x,y:mid+18,'text-anchor':'middle','class':'dim mono','font-size':10})});
 txt('NOTES',{x:40,y:24,'class':'dim mono','font-size':10});txt('TASKS',{x:40,y:H-14,'class':'dim mono','font-size':10});
 var lv={up:0,dn:0};N.forEach(function(n){var x=X(n.d)+40,isT=n.k==='task',k=isT?'dn':'up',l=lv[k]++%3;pos[n.id]={x:x-70,y:isT?mid+30+l*44:mid-68-l*44,w:140,h:34,cx:x}});
 N.forEach(function(n){var p=pos[n.id];el('line',{x1:p.cx,x2:p.cx,y1:mid,y2:n.k==='task'?p.y:p.y+p.h,stroke:'#2A313A','stroke-dasharray':'2 3'},edges)});
 E.forEach(function(e,i){var a=pos[e[0]],b=pos[e[1]];var x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y;
  var p=el('path',{d:'M'+x1+' '+y1+'C'+x1+' '+(y1+60)+' '+x2+' '+(y2-60)+' '+x2+' '+y2,'class':'e',stroke:PR[N.filter(function(n){return n.id===e[1]})[0].p].c,'stroke-width':1.8,opacity:.9},edges);p.dataset.i=i});
 N.forEach(function(n){var p=pos[n.id],g=el('g',{'class':'n',transform:'translate('+p.x+' '+p.y+')'},nodes);g.dataset.id=n.id;
  el('rect',{width:p.w,height:p.h,rx:5,fill:'#1F252C',stroke:PR[n.p].c,'stroke-opacity':.6,'stroke-dasharray':n.k==='scrap'?'4 3':''},g);
  el('circle',{cx:11,cy:p.h/2,r:4,fill:PRI[n.pr]},g);txt(n.t,{x:20,y:p.h/2+4,'font-size':11},g)});
 leg([['Network refresh','#5AA9E6'],['Data centre upkeep','#E6A35A'],['Dot = priority','#F26D6D'],['Dashed = scrap from the Inbox','#E6C35A']]);
}
svg.setAttribute('viewBox','0 0 '+W+' '+H);
</script>

<style>*{box-sizing:border-box}body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:#2B2F33;background:#F3F4F5}
.try{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid #D7DADD;font-size:12px;flex-wrap:wrap}.try b{color:#5E656C}
.try button{font:inherit;border:1px solid #C9CDD1;background:#F6F7F8;border-radius:6px;padding:3px 10px;cursor:pointer}
.frame{position:relative;height:400px;overflow:hidden;background:#F3F4F5}
.box{background:#fff;border:1px solid #D2D6DA;border-radius:6px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#80878E}
.h{font-family:"Cascadia Mono",Consolas,Menlo,monospace;color:#2B2F33;font-weight:600}
.tk{font:11px "Cascadia Mono",Consolas,monospace;background:#E9ECEF;border-radius:3px;padding:0 5px}
.mut{color:#80878E}
.wf{position:absolute;right:10px;bottom:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A0A6AC}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ed{display:flex;flex-direction:column;gap:8px;padding:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bar button{font:inherit;border:1px solid #C9CDD1;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.bar button[aria-pressed=true]{background:#2B2F33;color:#fff;border-color:#2B2F33}.sw{width:22px;height:22px;border-radius:50%;padding:0!important;border:2px solid #fff!important;box-shadow:0 0 0 1px #C9CDD1}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px #2B2F33}
canvas{display:block;width:100%;max-width:680px;height:auto;border:1px solid #D2D6DA;border-radius:6px;background:#fff;cursor:crosshair;touch-action:none}
</style>
<div class="try"><b>Try it:</b><span>pick a tool and drag on the picture. "Hide" blocks out a password or name before you save</span></div>
<div class="ed"><div class="bar" id="tools"><button data-t="box" aria-pressed="true">Box</button><button data-t="arrow">Arrow</button><button data-t="mark">Highlight</button><button data-t="hide">Hide</button><span style="width:10px"></span>
 <button class="sw" data-c="#D9363E" style="background:#D9363E" aria-pressed="true"></button><button class="sw" data-c="#E8A317" style="background:#E8A317"></button><button class="sw" data-c="#2F6FD1" style="background:#2F6FD1"></button>
 <span style="width:10px"></span><button id="undo">Undo</button><button id="crop">Crop to marks</button><button id="reset">Start over</button></div>
<canvas id="cv" width="680" height="300"></canvas></div>
<script>
var cv=document.getElementById('cv'),g=cv.getContext('2d'),tool='box',col='#D9363E',shapes=[],cur=null,crop=null;
function base(){g.fillStyle='#fff';g.fillRect(0,0,680,300);g.fillStyle='#E9ECEF';g.fillRect(0,0,680,28);g.fillStyle='#80878E';g.font='12px Segoe UI, sans-serif';g.fillText('Firewall — Rules — admin console (sample)',12,18);
 var rows=[['10','Allow','any','any','any'],['20','Allow','10.0.0.0/8','DMZ','443'],['30','Deny','guest-wifi','core','any'],['40','Allow','mgmt','all','22']];g.font='12px Consolas, monospace';
 ['#','Action','Source','Dest','Port'].forEach(function(h,i){g.fillStyle='#80878E';g.fillText(h,20+i*120,54)});
 rows.forEach(function(r,j){r.forEach(function(c,i){g.fillStyle='#2B2F33';g.fillText(c,20+i*120,82+j*26)})});g.fillStyle='#2B2F33';g.font='12px Segoe UI, sans-serif';g.fillText('Signed in as: admin.sample   Licence key: 4F2A-91C0-77D1-0B3E',20,250)}
function arrow(a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();var an=Math.atan2(d-b,c-a);g.beginPath();g.moveTo(c,d);g.lineTo(c-12*Math.cos(an-.45),d-12*Math.sin(an-.45));g.lineTo(c-12*Math.cos(an+.45),d-12*Math.sin(an+.45));g.closePath();g.fill()}
function draw(s){g.strokeStyle=g.fillStyle=s.c;g.lineWidth=3;var x=Math.min(s.x,s.x2),y=Math.min(s.y,s.y2),w=Math.abs(s.x2-s.x),h=Math.abs(s.y2-s.y);
 if(s.t==='box')g.strokeRect(x,y,w,h);else if(s.t==='arrow')arrow(s.x,s.y,s.x2,s.y2);else if(s.t==='mark'){g.globalAlpha=.35;g.fillRect(x,y,w,h);g.globalAlpha=1}else if(s.t==='hide'){g.fillStyle='#2B2F33';g.fillRect(x,y,w,h)}}
function render(){g.setTransform(1,0,0,1,0,0);if(crop){var k=Math.min(680/crop.w,300/crop.h);g.fillStyle='#F3F4F5';g.fillRect(0,0,680,300);g.setTransform(k,0,0,k,-crop.x*k,-crop.y*k)}base();shapes.forEach(draw);if(cur)draw(cur)}
function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*680/r.width,(e.clientY-r.top)*300/r.height]}
cv.addEventListener('pointerdown',function(e){if(crop)return;var p=pt(e);cur={t:tool,c:col,x:p[0],y:p[1],x2:p[0],y2:p[1]};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!cur)return;var p=pt(e);cur.x2=p[0];cur.y2=p[1];render()});
cv.addEventListener('pointerup',function(){if(cur&&(Math.abs(cur.x2-cur.x)>3||Math.abs(cur.y2-cur.y)>3))shapes.push(cur);cur=null;render()});
document.getElementById('tools').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}
 if(b.dataset.c){col=b.dataset.c;document.querySelectorAll('[data-c]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
document.getElementById('undo').onclick=function(){shapes.pop();render()};document.getElementById('reset').onclick=function(){shapes=[];crop=null;render()};
document.getElementById('crop').onclick=function(){if(!shapes.length)return;var x1=1e9,y1=1e9,x2=0,y2=0;shapes.forEach(function(s){x1=Math.min(x1,s.x,s.x2);y1=Math.min(y1,s.y,s.y2);x2=Math.max(x2,s.x,s.x2);y2=Math.max(y2,s.y,s.y2)});crop={x:x1-30,y:y1-30,w:x2-x1+60,h:y2-y1+60};render()};
shapes=[{t:'box',c:'#D9363E',x:14,y:64,x2:600,y2:90},{t:'arrow',c:'#D9363E',x:640,y:140,x2:606,y2:84}];render();
</script>

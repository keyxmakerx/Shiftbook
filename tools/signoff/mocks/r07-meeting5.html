<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
:root{--desk:#e9ecef;--paper:#fffdf8;--paper2:#f6f3ec;--ink:#1d2126;--ink2:#4a525b;--mut:#69727c;--rule:rgba(29,33,38,.1);
--accent:#3d5bb0;--warn:#9f5a06;--wash:#fcf1df;--ok:#2e8a5a;--teal:#178F7C;--coral:#E0573A;--plum:#8C4F7A;--amber:#E9A23B;
--display:Fraunces,Georgia,serif;--ui:'Instrument Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,monospace;
--shadow:0 1px 1px rgba(29,33,38,.06),0 10px 24px -14px rgba(29,33,38,.35);--ease:cubic-bezier(.2,.85,.25,1.08)}
html,body{margin:0}body{background:var(--desk);color:var(--ink);font:14px/1.45 var(--ui);padding:12px}
.try{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;flex-wrap:wrap}.try b{color:var(--mut)}
.seg{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px 11px;font:600 13px var(--ui);cursor:pointer}
.seg[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.why{font-size:12.5px;color:var(--ink2);margin:0 0 8px;background:#fff;border-radius:7px;padding:8px 11px;border:1px solid var(--rule)}.why b{color:var(--ink)}
.head{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap;background:var(--paper);border-radius:7px;box-shadow:inset 0 0 0 1px var(--rule);margin-bottom:6px}
.head h1{font:600 18px/1.2 var(--display);margin:0;flex:1;min-width:140px}
.pill{font:600 12px var(--ui);background:var(--paper2);border-radius:99px;padding:3px 10px;color:var(--ink2);border:0;transition:transform .3s var(--ease),background .3s}
.pill.bump{transform:scale(1.15);background:#e3f4ee}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 11px;font:600 12.5px var(--ui);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.recent{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--mut);margin:0 0 6px;min-height:22px;flex-wrap:wrap}
.recent button{border:0;border-radius:99px;padding:1px 10px;font:600 11.5px var(--ui);background:color-mix(in srgb,var(--c) 22%,#fff);cursor:pointer;animation:chip .35s var(--ease)}
@keyframes chip{from{opacity:0;transform:translateX(-8px)}}
.stage{position:relative;height:430px;overflow:hidden;border-radius:7px;background:var(--desk)}
/* lined paper + blocks shared */
.sheet{position:absolute;inset:0;background:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 26px;background-position:0 40px;border-radius:7px;box-shadow:var(--shadow),inset 0 0 0 1px var(--rule);cursor:text;overflow:hidden}
.sheet .ttl{position:absolute;left:16px;top:8px;font:600 19px var(--display);color:var(--ink);pointer-events:none;display:flex;gap:8px;align-items:center}
.sheet .ttl i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.blk{position:absolute;min-width:180px;max-width:300px;padding:4px 6px 6px;border-radius:6px;cursor:default;animation:pop .35s var(--ease)}
.blk:hover{box-shadow:inset 0 0 0 1px var(--rule)}
.blk.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 5%,transparent)}
.blk .grip{position:absolute;left:0;right:0;top:-6px;height:8px;cursor:grab;opacity:0}
.blk:hover .grip{opacity:1;background:linear-gradient(90deg,transparent 40%,var(--rule) 40% 60%,transparent 60%);background-size:100% 2px;background-repeat:no-repeat;background-position:center}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.ln{display:flex;gap:6px;padding:1px 4px;border-radius:4px;font-size:13.5px;line-height:24px}
.ln:hover{background:var(--paper2)}
.ln .mk{width:14px;flex:0 0 auto;text-align:center;font-weight:700;color:var(--mut)}
.ln.new{animation:ln .45s var(--ease)}@keyframes ln{from{opacity:0;transform:translateY(6px)}}
.tag{display:inline-block;font:600 10.5px/16px var(--ui);border-radius:99px;padding:0 7px;margin-left:5px}
.t-todo{background:#e6eefc;color:#2b4a9a}.t-task{background:#e3f4ee;color:#1d6b4d}.t-dec{background:#f3e6f0;color:#7a3c68}.t-q{background:var(--wash);color:var(--warn)}
.in{width:100%;font:inherit;font-size:13.5px;border:0;border-bottom:1px dashed color-mix(in srgb,var(--c) 60%,transparent);background:transparent;outline:0;padding:2px 4px;line-height:22px}
.hintbar{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mut);pointer-events:none;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:1px 6px;border-radius:5px;z-index:5}
/* V1 tabbed pages */
.tabs{display:flex;gap:3px;padding:0 6px;position:relative;z-index:2;flex-wrap:wrap}
.tabs button{border:0;border-radius:7px 7px 0 0;padding:6px 14px 5px;font:600 12.5px var(--ui);background:color-mix(in srgb,var(--c) 22%,#fff);cursor:pointer;color:var(--ink2);transition:transform .25s var(--ease),background .25s;transform:translateY(3px)}
.tabs button:hover{transform:translateY(0)}
.tabs button.on{background:var(--c);color:#fff;transform:translateY(0)}
.v1 .stage{border-top:3px solid var(--c)}
.slide-l{animation:sl .45s var(--ease)}.slide-r{animation:sr .45s var(--ease)}
@keyframes sl{from{transform:translateX(-60px);opacity:0}}@keyframes sr{from{transform:translateX(60px);opacity:0}}
/* V2 one canvas */
.world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.8,.2,1)}
.region{position:absolute;width:560px;height:400px;border-radius:14px;background:color-mix(in srgb,var(--c) 7%,var(--paper));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent);cursor:text}
.region .ttl{position:absolute;left:16px;top:10px;font:600 19px var(--display);display:flex;gap:8px;align-items:center;pointer-events:none}.region .ttl i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.v2 .stage{background:var(--paper);background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:18px 18px}
.allbtn{position:absolute;left:10px;bottom:8px;z-index:5}
/* V3 binder */
.v3 .stage{perspective:1400px;background:transparent;overflow:visible;height:460px}
.v3 .sheet{overflow:visible;top:30px;transition:transform .55s var(--ease),filter .4s,opacity .4s;transform-origin:50% 0}
.v3 .sheet.back{pointer-events:none;filter:brightness(.97)}
.v3 .dtab{position:absolute;top:-26px;height:28px;padding:5px 14px;border-radius:8px 8px 0 0;background:var(--c);color:#fff;font:600 12.5px var(--ui);cursor:pointer;pointer-events:auto;white-space:nowrap;box-shadow:0 -2px 6px -3px rgba(0,0,0,.25)}
.v3 .sheet.back .dtab{background:color-mix(in srgb,var(--c) 55%,#fff);color:var(--ink)}
.lift{animation:lift .6s var(--ease)}@keyframes lift{0%{transform:translateY(-34px) rotateX(14deg);opacity:.6}100%{transform:none}}
/* menu + fly */
.menu{position:fixed;z-index:20;background:#fff;border-radius:8px;box-shadow:var(--shadow),0 0 0 1px var(--rule);padding:4px;font-size:12.5px;transform-origin:top left;animation:fold .22s var(--ease)}
@keyframes fold{from{transform:scaleY(.4);opacity:0}}
.menu div{padding:5px 12px;border-radius:5px;cursor:pointer}.menu div:hover{background:var(--paper2)}
.fly{position:fixed;z-index:30;pointer-events:none;font:600 12px var(--ui);background:#e3f4ee;color:#1d6b4d;border-radius:99px;padding:2px 9px;transition:transform .6s cubic-bezier(.5,0,.3,1),opacity .6s}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="try"><b>Compare:</b>
<button class="seg" data-v="v1" aria-pressed="true">1 · Tabs over paper pages</button>
<button class="seg" data-v="v2" aria-pressed="false">2 · One big canvas, tabs fly you there</button>
<button class="seg" data-v="v3" aria-pressed="false">3 · Binder with divider tabs</button>
</div>
<p class="why" id="why"></p>
<div class="head"><h1>Weekly ops sync</h1><span class="pill" id="count"></span><span class="pill">⏱ 0:24</span><button class="btn primary" id="wrap">Wrap up</button></div>
<div class="recent" id="recent"></div>
<div id="wrapv"><div id="tabs"></div><div class="stage" id="stage"></div></div>
<div class="toast" id="toast"></div>
<script>
const WHY={
 v1:'<b>1 · Tabs over paper pages.</b> Your picks, on paper. Each tab is its own page; <b>click anywhere on it</b> to start writing there, like OneNote. Switching tabs slides the page left or right, so you feel which way you went.',
 v2:'<b>2 · One big canvas.</b> All topics live on one big sheet as coloured areas. The tabs are bookmarks: click one and the view glides across to that area. <b>See all</b> pulls back to show the whole meeting at once.',
 v3:'<b>3 · Binder with divider tabs.</b> Topics are sheets in a binder, with their tabs sticking out along the top. Clicking a tab lifts that sheet to the front. Each sheet is a free page you write anywhere on.'};
const COL=['var(--teal)','var(--coral)','var(--plum)','var(--accent)','#4f8a2e','var(--amber)'];
const KIND={todo:['☐','t-todo','Todo'],task:['→','t-task','Task'],dec:['!','t-dec','Decision'],q:['?','t-q','Question'],note:['•','','']};
let view='v1';
let T=[{n:'Patching window',b:[{x:20,y:46,ls:[['note','Moves to Tuesday nights'],['dec','Two-person check on reboots']]},{x:300,y:150,ls:[['todo','Update the patching MOP']]}]},
 {n:'New starter laptops',b:[{x:20,y:46,ls:[['note','Five next week, two docks missing'],['q','Who signs off the dock order?']]}]},
 {n:'Printer tickets',b:[{x:20,y:46,ls:[['note','INC0045678 and INC0045690, same model']]}]}];
let cur=2,curB=0,recent=[0,1,2],dir=0,fresh=null,newBlk=false;
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function say(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('on'),2400)}
const col=i=>COL[i%COL.length];
function go(i,b){if(zoomAll){zoomAll=false;if(i===cur){draw(true,false);return}}if(i===cur&&b==null)return;dir=i>cur?1:-1;cur=i;curB=b!=null?b:T[i].b.length-1;recent=recent.filter(x=>x!==i);recent.push(i);if(recent.length>5)recent.shift();draw(true,true)}
function add(v){v=v.trim();if(!v)return;
 if(v.startsWith('#')){const nm=v.replace(/^#+\s*/,'');if(!nm)return;let j=T.findIndex(t=>t.n.toLowerCase().startsWith(nm.toLowerCase()));if(j<0){T.push({n:nm,b:[{x:20,y:46,ls:[]}]});j=T.length-1;say('New tab: '+nm)}go(j);return}
 let k='note';if(/^\[\s?\]/.test(v)){k='todo';v=v.replace(/^\[\s?\]\s*/,'')}else if(v.startsWith('!')){k='dec';v=v.slice(1).trim()}else if(v.startsWith('?')){k='q';v=v.slice(1).trim()}else if(/\?$/.test(v))k='q';
 const B=T[cur].b[curB];B.ls.push([k,v]);fresh=[cur,curB,B.ls.length-1];draw(true,false);if(k!=='note')bump()}
function bump(){const c=$('count');c.classList.add('bump');setTimeout(()=>c.classList.remove('bump'),350)}
function closeMenu(){document.querySelectorAll('.menu').forEach(m=>m.remove())}
function fly(fromEl,text){const r=fromEl.getBoundingClientRect(),t=$('count').getBoundingClientRect();const f=el('div','fly',text);f.style.left=r.left+'px';f.style.top=r.top+'px';document.body.append(f);
 requestAnimationFrame(()=>{f.style.transform='translate('+(t.left-r.left)+'px,'+(t.top-r.top)+'px) scale(.6)';f.style.opacity='.2'});setTimeout(()=>{f.remove();bump()},620)}
function lineEl(ti,bi,j){const l=T[ti].b[bi].ls[j];const r=el('div','ln'+(fresh&&fresh[0]===ti&&fresh[1]===bi&&fresh[2]===j?' new':''));r.append(el('span','mk',KIND[l[0]][0]));const t=el('span',null,l[1]);if(l[0]!=='note')t.append(el('span','tag '+KIND[l[0]][1],KIND[l[0]][2]+(l[2]?' · '+l[2]:'')));r.append(t);
 r.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();closeMenu();const m=el('div','menu');[['todo','☐ Make a todo'],['task','→ Make a task'],['dec','! Mark as decision'],['q','? Mark as question'],['note','• Plain note']].forEach(([k,lab])=>{const d=el('div',null,lab);d.onclick=ev=>{ev.stopPropagation();closeMenu();const was=l[0];l[0]=k;if(k==='task')l[2]='Fri';if(k!=='note'&&k!==was)fly(r,KIND[k][2]);fresh=null;draw(false,false);if(k==='task')say('Task made, due Friday. It shows on the Desk.')};m.append(d)});m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';document.body.append(m)};
 return r}
function blockEl(ti,bi,active){const B=T[ti].b[bi];const d=el('div','blk'+(active?' on':''));d.style.left=B.x+'px';d.style.top=B.y+'px';d.style.setProperty('--c',col(ti));if(!(newBlk&&active))d.style.animation='none';
 const g=el('div','grip');d.append(g);B.ls.forEach((_,j)=>d.append(lineEl(ti,bi,j)));
 if(active){const i=el('input','in');i.id='box';i.autocomplete='off';i.placeholder=B.ls.length?'Keep typing…':'Type here…';i.onkeydown=e=>{if(e.key==='Enter'){add(i.value);e.preventDefault()}if(e.key==='Escape'&&!B.ls.length){T[ti].b.splice(bi,1);curB=Math.max(0,T[ti].b.length-1);draw(false,false)}};d.append(i)}
 d.onmousedown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();if(!active){cur=ti;curB=bi;draw(true,false)}};
 g.onpointerdown=e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY,ox=B.x,oy=B.y;const mv=ev=>{B.x=Math.max(0,ox+ev.clientX-sx);B.y=Math.max(36,oy+ev.clientY-sy);d.style.left=B.x+'px';d.style.top=B.y+'px'};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)};
 return d}
function surface(ti,cls){const s=el('div',cls);s.style.setProperty('--c',col(ti));const t=el('div','ttl');t.append(el('i'),document.createTextNode(T[ti].n));s.append(t);
 T[ti].b.forEach((_,bi)=>s.append(blockEl(ti,bi,ti===cur&&bi===curB)));
 s.onmousedown=e=>{if(e.target!==s)return;e.preventDefault();if(ti!==cur||zoomAll){go(ti);return}const r=s.getBoundingClientRect();const sc=r.width/s.offsetWidth||1;
  const x=Math.max(8,Math.min(s.offsetWidth-200,(e.clientX-r.left)/sc-8)),y=Math.max(40,Math.min(s.offsetHeight-60,(e.clientY-r.top)/sc-12));
  const blank=T[ti].b.findIndex(b=>!b.ls.length);if(blank>=0)T[ti].b.splice(blank,1);T[ti].b.push({x,y,ls:[]});curB=T[ti].b.length-1;newBlk=true;draw(true,false);newBlk=false};
 return s}
function tabsEl(){const tb=el('div','tabs');T.forEach((t,i)=>{const b=el('button',i===cur?'on':null,t.n);b.style.setProperty('--c',col(i));b.onclick=()=>go(i);tb.append(b)});const a=el('button',null,'+');a.style.setProperty('--c','#9aa0a6');a.title='New tab';a.onclick=()=>{T.push({n:'Topic '+(T.length+1),b:[{x:20,y:46,ls:[]}]});go(T.length-1)};tb.append(a);return tb}
let zoomAll=false,lastT=null;
function draw(focus,switched){closeMenu();const W=$('wrapv'),S=$('stage'),TB=$('tabs');W.className=view;W.style.setProperty('--c',col(cur));S.innerHTML='';TB.innerHTML='';
 if(view!=='v3')TB.append(tabsEl());
 if(view==='v1'){const s=surface(cur,'sheet'+(switched&&dir?(dir>0?' slide-r':' slide-l'):''));S.append(s)}
 if(view==='v2'){const w=el('div','world');T.forEach((t,i)=>{const r=surface(i,'region');r.style.left=(i%2)*600+'px';r.style.top=Math.floor(i/2)*440+'px';w.append(r)});S.append(w);
  const ab=el('button','btn allbtn',zoomAll?'Back to '+T[cur].n:'⤢ See all');ab.onclick=()=>{zoomAll=!zoomAll;draw(false,false)};S.append(ab);
  if(lastT){w.style.transition='none';w.style.transform=lastT;void w.offsetWidth;w.style.transition=''}{const Wd=S.clientWidth,H=S.clientHeight;let tf;if(zoomAll){const rows=Math.ceil(T.length/2),cols=Math.min(2,T.length);const s=Math.min(Wd/(cols*600),H/(rows*440))*.95;tf='translate(10px,10px) scale('+s+')'}else{const x=(cur%2)*600,y=Math.floor(cur/2)*440;const s=Math.min(1,Wd/580,H/420);tf='translate('+(Wd/2-(x+280)*s)+'px,'+(H/2-(y+200)*s)+'px) scale('+s+')'}requestAnimationFrame(()=>{w.style.transform=tf});lastT=tf}}
 if(view==='v3'){const n=T.length;const tw=Math.max(110,Math.min(170,(S.clientWidth-30)/n));
  T.forEach((t,i)=>{if(i===cur)return;const depth=1+((i-cur+n)%n);const s=surface(i,'sheet back');s.style.transform='translateY('+(-depth*4)+'px) scale('+(1-depth*.012)+')';s.style.zIndex=10-depth;addTab(s,i,tw);S.append(s)});
  const f=surface(cur,'sheet'+(switched?' lift':''));f.style.zIndex=20;addTab(f,cur,tw);S.append(f)}
 S.append(el('div','hintbar','Click empty paper to write there · right-click a line · #name for a tab'));
 const R=$('recent');R.innerHTML='';R.append(document.createTextNode('Recent:'));recent.slice().reverse().forEach(i=>{const b=el('button',null,T[i].n);b.style.setProperty('--c',col(i));if(i===cur){b.style.boxShadow='0 0 0 2px '+col(i)}else b.style.animation='none';b.onclick=()=>go(i);R.append(b)});
 const c={todo:0,task:0,dec:0,q:0};T.forEach(t=>t.b.forEach(b=>b.ls.forEach(l=>{if(l[0] in c)c[l[0]]++})));$('count').textContent=c.todo+' todos · '+c.task+' tasks · '+c.dec+' decision · '+c.q+' question';
 fresh=null;if(focus)setTimeout(()=>{const b=$('box');if(b)b.focus({preventScroll:true})},view==='v2'?720:30)}
function addTab(s,i,tw){const t=el('div','dtab',T[i].n);t.style.left=(14+i*tw)+'px';t.style.maxWidth=(tw-6)+'px';t.style.overflow='hidden';t.style.textOverflow='ellipsis';t.onmousedown=e=>{e.stopPropagation();e.preventDefault();go(i)};s.append(t)}
document.addEventListener('click',closeMenu);
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{view=b.dataset.v;zoomAll=false;lastT=null;document.querySelectorAll('.seg').forEach(x=>x.setAttribute('aria-pressed',x===b));$('why').innerHTML=WHY[view];draw(false,true)});
$('wrap').onclick=()=>say('Wrap up lists todos, tasks and decisions, and offers to log the time.');
$('why').innerHTML=WHY[view];draw(false,false);
;(function(){function t(){parent.postMessage({sbMockHeight:document.documentElement.scrollHeight},"*")}addEventListener("load",t);addEventListener("resize",t);new ResizeObserver(t).observe(document.body)})()
</script></body></html>

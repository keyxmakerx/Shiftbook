<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}
:root{--desk:#e9ecef;--paper:#fffdf8;--paper2:#f6f3ec;--ink:#1d2126;--ink2:#4a525b;--mut:#5f6872;--rule:rgba(29,33,38,.12);
--accent:#3d5bb0;--aw:#e6ebf8;--warn:#9f5a06;--ww:#fcf1df;--ok:#2e8a5a;--okw:#e3f2ea;--bad:#c2412d;--phone:#1b1e22;--on:#fff;
--display:Fraunces,Georgia,'Times New Roman',serif;--ui:'Instrument Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}
@media (prefers-color-scheme:dark){:root{--desk:#14171b;--paper:#23272d;--paper2:#2a2f36;--ink:#e7eaee;--ink2:#b9c0c8;--mut:#949da7;--rule:rgba(255,255,255,.1);--accent:#8ea6ee;--aw:#2a3350;--warn:#f0b45a;--ww:#3a2c14;--ok:#6ccb95;--okw:#1d3328;--bad:#f08a78;--phone:#050607;--on:#14171b}}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.45 var(--ui);padding:14px}
.grid{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center}
.shot{width:244px;display:flex;flex-direction:column;gap:8px;margin:0}
.shot figcaption{font-size:12.5px;color:var(--ink2)}
.shot figcaption b{color:var(--ink)}
.tag{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.phone{width:244px;height:500px;border-radius:30px;background:var(--phone);padding:9px}
.screen{width:100%;height:100%;border-radius:22px;background:var(--desk);overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:11.5px;line-height:1.35}
.status{display:flex;justify-content:space-between;padding:7px 14px 3px;font:10px var(--mono);color:var(--mut)}
.top{padding:3px 12px 9px;display:flex;flex-direction:column;gap:1px}
.day{font:600 17px var(--display)}
.sum{color:var(--mut)} .sum b{color:var(--ink)}
.body{flex:1;overflow:hidden;padding:0 9px;display:flex;flex-direction:column;gap:7px}
.timer{background:var(--accent);color:var(--on);border-radius:9px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center}
.timer .t{font:13px var(--mono)} .timer .x{border:1px solid currentColor;border-radius:6px;padding:1px 7px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:8px 9px;display:flex;flex-direction:column;gap:4px;position:relative}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.h{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.title{font-weight:600}
.proj{display:inline-flex;align-items:center;gap:5px;color:var(--mut);font-size:10.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}.dot.g{background:var(--ok)}.dot.o{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:10px var(--mono);background:var(--paper2);border:1px solid var(--rule);border-radius:5px;padding:1px 6px}.chip.ok{background:var(--okw)}
.due{background:var(--ww);color:var(--warn);border-radius:9px;padding:7px 9px;display:flex;justify-content:space-between;font-weight:600}
.fab{position:absolute;right:12px;bottom:60px;width:48px;height:48px;border-radius:15px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--rule);padding:6px 3px 11px;text-align:center;font-size:9.5px;color:var(--mut)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:3px}
.nav i{width:17px;height:17px;border-radius:5px;border:1.6px solid currentColor;display:block}
.nav .on{color:var(--accent);font-weight:600}.nav .on i{background:var(--aw)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:16px 16px 0 0;padding:9px 12px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 30px -12px rgba(0,0,0,.4)}
.grab{width:34px;height:4px;border-radius:2px;background:var(--rule);align-self:center}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.box{border:2px solid var(--accent);border-radius:9px;padding:8px 9px;font:11.5px var(--mono)}
.cur{display:inline-block;width:1.5px;height:12px;background:var(--accent);vertical-align:-2px}
.parsed{display:flex;flex-wrap:wrap;gap:5px}
.pt{font-size:10.5px;border-radius:999px;padding:2px 8px;background:var(--aw)}
.btns{display:flex;gap:7px}
.btn{flex:1;text-align:center;border-radius:9px;padding:8px;border:1px solid var(--rule);font-weight:600;background:var(--paper)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
.keys{background:var(--paper2);margin:0 -12px -12px;padding:7px 5px 12px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.keys span{height:24px;border-radius:5px;background:var(--paper);border:1px solid var(--rule)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 20px;text-align:center}
.mark{width:52px;height:52px;border-radius:15px;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font:600 24px var(--display);color:var(--accent)}
.field{align-self:stretch;border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:9px;text-align:left;color:var(--mut)}
.finger{width:50px;height:50px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center}
.finger svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round}
.small{font-size:10.5px;color:var(--mut)}
h3{margin:0;font:600 14px var(--ui)}
h4{margin:0;font:600 16px var(--display)}
.wall{background:linear-gradient(160deg,#2c3a5c,#1a2236 60%,#121726);color:#e7eaee}
.clock{font:400 50px var(--display);text-align:center;margin-top:40px}
.date{text-align:center;opacity:.8}
.notif{margin:22px 10px 0;background:rgba(255,255,255,.14);border-radius:13px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;color:#e7eaee}
.notif .app{font-size:9.5px;opacity:.75;display:flex;gap:6px;align-items:center}
.notif .app i{width:11px;height:11px;border-radius:3px;background:#8ea6ee;display:block}
.notif b{font-size:12.5px}
.notif .acts{display:flex;gap:14px;margin-top:4px;font-weight:600;color:#b9c8f5;font-size:11px}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:9px;display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--mut);font-size:10px}
.sw{width:30px;height:17px;border-radius:9px;background:var(--rule);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--paper)}
.sw.on{background:var(--accent)}.sw.on::after{left:15px}
.lbl{font:600 9.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 3px}
.ok{color:var(--ok);font-weight:600}
.callout{font-size:10.5px;background:var(--ww);color:var(--warn);border-radius:8px;padding:7px 9px}
</style></head><body><div class="grid">

</div></div><figcaption><b>Unlock.</b> The fingerprint button only shows once you've turned it on. After a restart of the phone it asks for the password once, the way banking apps do.</figcaption></figure>

[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
shiftbook-core = { path = "crates/core" }
shiftbook-storage = { path = "crates/storage" }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
# No `macros` feature: no compile-time checked queries, no DATABASE_URL. No extension loading.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
# Newest version sqlx 0.9 accepts; swaps the bundled SQLite for SQLCipher with vendored OpenSSL.
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.1"
secrecy = "0.10.3"
# Backups are gzip-compressed before encryption; already in the lock file through Tauri.
flate2 = "1.1.10"
# Already in the lock file through Tauri; only features Tauri already enables.
tokio = { version = "1.53.3", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }

# Argon2 is ~10x slower unoptimised; keep debug builds and tests close to release
# timing so unlock in `tauri dev` and the calibration test behave realistically.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

name: Release

# Builds installers and no-install builds for Windows, macOS and Linux and attaches them to a
# GitHub release. Start it by publishing a release on GitHub's Releases page, or with "Run
# workflow" on the Actions tab. (Not on a tag push too: publishing a release pushes its tag, and
# that used to start a second, clashing build.) The app's version comes from the tag: 0.4.0 or
# v0.4.0 builds version 0.4.0. Builds are unsigned until code signing is set up (see SECURITY.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. 0.4.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple silicon)
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust_target }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Tauri 2 prerequisites for Linux: https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config

      - name: npm ci
        working-directory: web
        run: npm ci

      # The Windows installer only takes plain numbers (0.4.0), so a suffix such as
      # "-beta.1" is left out of the app's own version; the release keeps its full tag.
      - name: Use the release tag as the app version
        shell: bash
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '$TAG' doesn't start with a version like 0.4.0 or v0.4.0."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          echo "Building version $version"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          # Call the Tauri CLI directly: tauri-action rewrites scripts that start with npm.
          tauriScript: node ../../../web/node_modules/@tauri-apps/cli/tauri.js
          args: ${{ matrix.args }}
          tagName: ${{ env.TAG }}
          releaseName: 'Shiftbook ${{ env.TAG }}'
          releaseBody: |
            Alpha build for testing. Not code-signed yet, so Windows shows "Windows protected your PC"
            (choose More info, then Run anyway) and macOS asks you to right-click the app and choose Open
            the first time.

            - **Windows, no install:** `Shiftbook-portable.exe` runs from anywhere.
            - **Windows installer:** the `.msi` or `-setup.exe`.
            - **macOS:** the `.dmg` for your Mac (Apple silicon = aarch64, Intel = x64).
            - **Linux, no install:** the `.AppImage`. Debian/Ubuntu: the `.deb`.
          releaseDraft: false
          prerelease: true

      # The plain .exe runs without installing anything; publish it alongside the installers.
      - name: Upload Windows portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls target/release/*.exe | head -n 1)
          cp "$exe" Shiftbook-portable.exe
          gh release upload "$TAG" Shiftbook-portable.exe --clobber --repo "$GITHUB_REPOSITORY"
